<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#050505">
  <title>LLV · Смены</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="frame" aria-hidden="true"></div>

  <section id="gate" class="gate" hidden>
    <div class="mark">
      <p class="eyebrow">Новая эра · 2026</p>
      <strong>LLV</strong>
    </div>
    <form id="login" class="panel" autocomplete="off">
      <p class="eyebrow">Панель смен</p>
      <h1>Кто сколько сделал</h1>
      <p class="lede">Расширение на FunPay открывает смену и само присылает новые заказы. Чистыми остаётся 10% оборота.</p>
      <label for="password">Пароль</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="128">
      <p id="login-error" class="error" role="alert"></p>
      <button class="primary" type="submit">Войти</button>
    </form>
  </section>

  <section id="desk" class="desk" hidden>
    <header class="top">
      <a class="brand" href="/">LLV</a>
      <p class="brand-sub">Смены</p>
      <div class="top-side">
        <time id="clock" datetime=""></time>
        <button id="logout" class="text" type="button">Выйти</button>
      </div>
    </header>

    <div class="layout">
      <aside class="roster-wrap">
        <div class="aside-head">
          <p class="eyebrow">Люди</p>
          <button id="everyone" class="text" type="button" hidden>Вся команда</button>
        </div>
        <div id="roster" class="roster"></div>
      </aside>

      <div class="stage">
        <div class="stage-head">
          <div class="range" id="range" role="tablist" aria-label="Период">
            <button type="button" data-range="today" aria-pressed="true">Сегодня</button>
            <button type="button" data-range="week" aria-pressed="false">Неделя</button>
            <button type="button" data-range="month" aria-pressed="false">Месяц</button>
            <button type="button" data-range="all" aria-pressed="false">Всё время</button>
          </div>
          <p id="scope" class="scope">Вся команда · день по Владивостоку</p>
        </div>

        <div class="hero" aria-live="polite">
          <div>
            <span>Штуки</span>
            <b id="n-qty">0</b>
          </div>
          <div class="profit">
            <span>Чистыми 10%</span>
            <b id="n-profit">0 ₽</b>
          </div>
          <div>
            <span>Оборот</span>
            <b id="n-gross">0 ₽</b>
          </div>
        </div>

        <section class="block">
          <p class="eyebrow">На смене</p>
          <div id="live"></div>
        </section>

        <section class="block">
          <p class="eyebrow">Продажи</p>
          <div id="feed"></div>
        </section>
      </div>
    </div>
  </section>

  <script src="/app.js"></script>
</body>
</html>
