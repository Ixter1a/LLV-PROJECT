<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LLV · Настройки</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #09090b;
      color: #f6f5f3;
      font-family: "Segoe UI", sans-serif;
    }
    main { max-width: 520px; padding: 48px 28px; }
    img { width: 72px; height: 54px; object-fit: contain; }
    .eyebrow { color: rgba(246,245,243,.55); font-size: 14px; font-weight: 600; }
    h1 { font-size: 40px; letter-spacing: -0.03em; margin: 8px 0 12px; font-weight: 650; }
    p { color: rgba(244,244,242,.7); line-height: 1.5; }
    label { display: block; margin-top: 18px; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(244,244,242,.5); }
    input {
      width: 100%;
      margin-top: 8px;
      padding: 12px 14px;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 14px;
      color: #fff;
      font: 16px/1.3 "Segoe UI", sans-serif;
      outline: none;
    }
    button {
      margin-top: 22px;
      height: 48px;
      padding: 0 22px;
      border: 0;
      border-radius: 999px;
      background: #f4f4f2;
      color: #111;
      font-weight: 650;
      cursor: pointer;
    }
    #status { min-height: 1.4em; }
  </style>
</head>
<body>
  <main>
    <img src="icons/mark.png" alt="">
    <p class="eyebrow">LLV · расширение</p>
    <h1>Настройки</h1>
    <p>Адрес панели и личный ключ выдают в панели. Ключ привязан к одному имени и не открывает чужие смены.</p>
    <form id="form">
      <label>Адрес панели<input id="apiBase" type="url" placeholder="https://llv-shifts.apps.grok.bot" required></label>
      <label>Личный ключ<input id="workerToken" type="password" autocomplete="off" required></label>
      <p id="status"></p>
      <button type="submit">Сохранить</button>
    </form>
  </main>
  <script src="options.js"></script>
</body>
</html>
