<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LLV · Настройки</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #050505;
      color: #f4f4f2;
      font-family: "Segoe UI", sans-serif;
    }
    main { max-width: 520px; padding: 48px 28px; }
    .eyebrow { letter-spacing: 0.22em; text-transform: uppercase; color: rgba(244,244,242,.5); font-size: 12px; }
    h1 { font-size: 48px; letter-spacing: -0.05em; margin: 8px 0 12px; }
    p { color: rgba(244,244,242,.7); line-height: 1.5; }
    label { display: block; margin-top: 18px; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(244,244,242,.5); }
    input {
      width: 100%;
      margin-top: 8px;
      padding: 12px 0;
      background: transparent;
      border: 0;
      border-bottom: 1px solid rgba(255,255,255,.4);
      color: #fff;
      font: 18px/1.3 "Segoe UI", sans-serif;
      outline: none;
    }
    button {
      margin-top: 22px;
      height: 48px;
      padding: 0 22px;
      border: 0;
      background: #f4f4f2;
      color: #050505;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
    }
    #status { min-height: 1.4em; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">LLV · расширение</p>
    <h1>Настройки</h1>
    <p>Адрес панели и ключ выдаёт тот, кто открывает сайт. Имя увидят в списке смен.</p>
    <form id="form">
      <label>Адрес панели<input id="apiBase" type="url" placeholder="https://example.com" required></label>
      <label>Ключ расширения<input id="extensionKey" type="password" autocomplete="off" required></label>
      <label>Имя<input id="workerName" maxlength="32" placeholder="Аня" required></label>
      <p id="status"></p>
      <button type="submit">Сохранить</button>
    </form>
  </main>
  <script src="options.js"></script>
</body>
</html>
