<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LLV</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      width: 320px;
      background: #09090b;
      color: #f6f5f3;
      font-family: "Segoe UI", sans-serif;
    }
    main { padding: 16px 16px 18px; }
    .top { display: flex; align-items: center; gap: 10px; }
    img { width: 36px; height: 28px; object-fit: contain; }
    strong { display: block; font-size: 18px; letter-spacing: -0.03em; }
    #shift { margin: 2px 0 0; color: rgba(246,245,243,.62); font-size: 13px; }
    form { margin-top: 14px; }
    label {
      display: block;
      margin-top: 10px;
      color: rgba(246,245,243,.5);
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    input {
      box-sizing: border-box;
      width: 100%;
      margin-top: 6px;
      height: 40px;
      padding: 0 12px;
      border: 0;
      border-radius: 999px;
      background: rgba(255,255,255,.06);
      color: #fff;
      font: 14px/1.3 "Segoe UI", sans-serif;
      outline: none;
    }
    button {
      width: 100%;
      margin-top: 14px;
      height: 40px;
      border: 0;
      border-radius: 999px;
      background: #f4f4f2;
      color: #111;
      font-weight: 600;
      cursor: pointer;
    }
    #status { min-height: 1.2em; margin: 8px 0 0; font-size: 13px; color: rgba(246,245,243,.72); }
    a { color: rgba(246,245,243,.7); font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <div class="top">
      <img src="icons/mark.png" alt="">
      <div>
        <strong>LLV</strong>
        <p id="shift">Смена не начата</p>
      </div>
    </div>
    <form id="form">
      <label>Адрес панели<input id="apiBase" type="url" placeholder="https://llv-shifts.apps.grok.bot" required></label>
      <label>Личный ключ<input id="workerToken" type="password" autocomplete="off" placeholder="llv_…" required></label>
      <p id="status"></p>
      <button type="submit">Сохранить</button>
    </form>
  </main>
  <script src="settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
